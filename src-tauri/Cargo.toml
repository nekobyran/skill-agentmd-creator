[package]
name = "skill-agentmd-creator"
version = "1.0.0"
description = "Skill/agentmd creator"
authors = ["Nekobyran"]
license = "Apache-2.0"
repository = "https://github.com/nekobyran/skill-agentmd-creator"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
ureq = { version = "2", features = ["json"] }
