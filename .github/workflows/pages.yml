name: Verify SkillCreator release page

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'project/skillcreator-site-static/**'
      - 'project/skillcreator-flutter/pubspec.yaml'
      - 'command/Build-SkillCreatorSite.mjs'
      - 'command/Verify-SkillCreatorSite.mjs'
      - 'RELEASE_NOTES.md'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'project/skillcreator-site-static/**'
      - 'project/skillcreator-flutter/pubspec.yaml'
      - 'command/Build-SkillCreatorSite.mjs'
      - 'command/Verify-SkillCreatorSite.mjs'
      - 'RELEASE_NOTES.md'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

concurrency:
  group: skillcreator-release-page-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build static release page
        run: node command/Build-SkillCreatorSite.mjs

      - name: Verify built release page
        run: node command/Verify-SkillCreatorSite.mjs --root=release/skillcreator-site-static/web/release --require-release

      - name: Upload verified static page
        uses: actions/upload-artifact@v4
        with:
          name: skillcreator-release-page-${{ github.sha }}
          path: release/skillcreator-site-static/web/release
          if-no-files-found: error
          retention-days: 14
