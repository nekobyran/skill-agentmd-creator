name: Publish SkillCreator release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.0.0
        required: true
        default: v1.0.0
        type: string
      replace_existing:
        description: Replace an existing prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: skillcreator-release-${{ github.ref_name }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve and validate release tag
        id: release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = if ('${{ github.event_name }}' -eq 'push') {
            '${{ github.ref_name }}'
          } else {
            '${{ inputs.tag }}'
          }
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?)$') {
            throw "Invalid SkillCreator release tag: $tag"
          }
          $pubspec = Get-Content -LiteralPath project/skillcreator-flutter/pubspec.yaml -Raw -Encoding UTF8
          $flutterMatch = [regex]::Match($pubspec, '(?m)^version:\s*(?<version>[^\s+]+)(?:\+[^\s]+)?\s*$')
          if (-not $flutterMatch.Success -or $flutterMatch.Groups['version'].Value -cne $Matches.version) {
            throw "Tag version $($Matches.version) does not match Flutter pubspec."
          }
          $cargo = Get-Content -LiteralPath project/skillcreator-rust-server/Cargo.toml -Raw -Encoding UTF8
          $cargoMatch = [regex]::Match($cargo, '(?ms)^\[package\]\s*.*?^version\s*=\s*"(?<version>[^"]+)"')
          if (-not $cargoMatch.Success -or $cargoMatch.Groups['version'].Value -cne $Matches.version) {
            throw "Tag version $($Matches.version) does not match Rust Cargo.toml."
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($Matches.version)" >> $env:GITHUB_OUTPUT

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Verify Flutter client
        shell: pwsh
        working-directory: project/skillcreator-flutter
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

      - name: Verify and build Rust sidecar
        shell: pwsh
        run: |
          cargo fmt --manifest-path project/skillcreator-rust-server/Cargo.toml -- --check
          cargo clippy --manifest-path project/skillcreator-rust-server/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path project/skillcreator-rust-server/Cargo.toml
          cargo build --manifest-path project/skillcreator-rust-server/Cargo.toml --release --target x86_64-pc-windows-msvc

      - name: Build Flutter Windows release
        shell: pwsh
        working-directory: project/skillcreator-flutter
        run: flutter build windows --release

      - name: Assemble portable bundle
        id: assets
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $runner = 'project/skillcreator-flutter/build/windows/x64/runner/Release'
          $sidecar = 'project/skillcreator-rust-server/target/x86_64-pc-windows-msvc/release/skill_api_server.exe'
          foreach ($required in @(
            (Join-Path $runner 'skillcreator_flutter.exe'),
            (Join-Path $runner 'flutter_windows.dll'),
            (Join-Path $runner 'data'),
            $sidecar
          )) {
            if (-not (Test-Path -LiteralPath $required)) {
              throw "Required release artifact is missing: $required"
            }
          }
          Copy-Item -LiteralPath $sidecar -Destination (Join-Path $runner 'skill_api_server.exe') -Force

          $releaseRoot = Join-Path 'release/github_release' $env:TAG
          $stage = Join-Path $releaseRoot "SkillCreator-$env:TAG-Windows-x64"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -Path (Join-Path $runner '*') -Destination $stage -Recurse -Force

          $zipName = "SkillCreator-$env:TAG-Windows-x64-Portable.zip"
          $zipPath = Join-Path $releaseRoot $zipName
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zipPath -CompressionLevel Optimal -Force
          $zipHash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksums = Join-Path $releaseRoot 'SHA256SUMS.txt'
          "$zipHash  $zipName" | Set-Content -LiteralPath $checksums -Encoding ascii

          $bundleFiles = Get-ChildItem -LiteralPath $stage -Recurse -File | ForEach-Object {
            $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
            [ordered]@{
              path = [IO.Path]::GetRelativePath($stage, $_.FullName).Replace('\', '/')
              bytes = $_.Length
              sha256 = $hash.Hash.ToLowerInvariant()
            }
          }
          $manifestPath = Join-Path $releaseRoot "SkillCreator-$env:TAG-manifest.json"
          [ordered]@{
            product = 'SkillCreator'
            framework = 'Flutter'
            backend = 'Rust sidecar'
            version = $env:VERSION
            tag = $env:TAG
            platform = 'windows-x64'
            generatedAtUtc = [DateTime]::UtcNow.ToString('o')
            portableArchive = [ordered]@{
              name = $zipName
              bytes = (Get-Item -LiteralPath $zipPath).Length
              sha256 = $zipHash
            }
            bundleFiles = @($bundleFiles)
          } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $manifestPath -Encoding utf8NoBOM

          "root=$releaseRoot" >> $env:GITHUB_OUTPUT
          "portable=$zipPath" >> $env:GITHUB_OUTPUT
          "checksums=$checksums" >> $env:GITHUB_OUTPUT
          "manifest=$manifestPath" >> $env:GITHUB_OUTPUT

      - name: Verify repository visibility and publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          PORTABLE: ${{ steps.assets.outputs.portable }}
          CHECKSUMS: ${{ steps.assets.outputs.checksums }}
          MANIFEST: ${{ steps.assets.outputs.manifest }}
          REPLACE_EXISTING: ${{ inputs.replace_existing }}
        run: |
          $ErrorActionPreference = 'Stop'
          $visibility = gh repo view $env:GITHUB_REPOSITORY --json visibility --jq '.visibility'
          if ($visibility.Trim() -ne 'PUBLIC') {
            throw 'Refusing to publish because the repository is not public.'
          }

          $exists = $true
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) { $exists = $false }
          $assets = @($env:PORTABLE, $env:CHECKSUMS, $env:MANIFEST)
          if ($exists) {
            if ($env:REPLACE_EXISTING -ne 'true') {
              throw "Release $env:TAG already exists. Enable replace_existing only for an intentional replacement."
            }
            gh release upload $env:TAG @assets --repo $env:GITHUB_REPOSITORY --clobber
            gh release edit $env:TAG --repo $env:GITHUB_REPOSITORY --title "SkillCreator $env:TAG" --notes-file RELEASE_NOTES.md --prerelease --latest=false
          } else {
            gh release create $env:TAG @assets --repo $env:GITHUB_REPOSITORY --title "SkillCreator $env:TAG" --notes-file RELEASE_NOTES.md --prerelease --latest=false --target $env:GITHUB_SHA
          }

      - name: Verify release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $release = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json isDraft,isPrerelease,url,assets | ConvertFrom-Json
          if ($release.isDraft -or -not $release.isPrerelease) {
            throw 'SkillCreator release is not a visible prerelease.'
          }
          $names = @($release.assets | ForEach-Object { $_.name })
          if ('SHA256SUMS.txt' -notin $names -or $names.Count -ne 3) {
            throw "Unexpected release assets: $($names -join ', ')"
          }
          Write-Output "release=$($release.url)"

      - name: Upload build evidence
        uses: actions/upload-artifact@v4
        with:
          name: skillcreator-${{ steps.release.outputs.tag }}-windows-x64
          path: ${{ steps.assets.outputs.root }}
          if-no-files-found: error
          retention-days: 14
