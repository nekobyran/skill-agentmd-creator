[package]
name = "skillcreator-rust-server"
version = "1.0.0"
description = "SkillCreator standalone local API and CLI backend"
authors = ["Nekobyran"]
license = "Apache-2.0"
repository = "https://github.com/nekobyran/skill-agentmd-creator"
edition = "2021"

[[bin]]
name = "skill_api_server"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
